<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — Aniversário</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f4f8;color:#29232d}.wrap{max-width:1050px;margin:auto;padding:30px 18px}.login{max-width:390px;margin:80px auto;padding:28px;background:#fff;border-radius:20px;box-shadow:0 8px 30px #0001}.field{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;margin:8px 0 14px;font-size:15px}.btn{border:0;background:#29232d;color:#fff;border-radius:10px;padding:13px 18px;cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:24px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 5px 20px #0001}.label{color:#777}.num{font-size:34px;font-weight:bold;margin-top:7px}.green{color:#20a568}.red{color:#df5364}.yellow{color:#d79b20}.panel{background:#fff;border-radius:18px;overflow:hidden}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:15px;border-bottom:1px solid #eee}th{background:#faf7fc}.empty{text-align:center;color:#999;padding:35px}.error{color:#b22b3b;margin-top:12px}@media(max-width:650px){.cards{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}table{font-size:13px}}
</style></head><body><div id="loginBox" class="login"><h1>🔐 Dashboard</h1><p>Entre com seu e-mail e senha.</p><input id="email" class="field" type="email" placeholder="Seu e-mail"><input id="password" class="field" type="password" placeholder="Sua senha"><button class="btn" onclick="login()">Entrar</button><div id="err" class="error"></div></div>
<div id="app" class="wrap" style="display:none"><div class="top"><h1>📊 Confirmações</h1><button class="btn" onclick="logout()">Sair</button></div><div class="cards"><div class="card"><div class="label">🟢 Confirmados</div><div id="vai" class="num green">0</div></div><div class="card"><div class="label">🔴 Não vão</div><div id="nao" class="num red">0</div></div><div class="card"><div class="label">👥 Total</div><div id="total" class="num yellow">0</div></div></div><div class="panel"><table><thead><tr><th>Nome</th><th>Resposta</th><th>Data</th></tr></thead><tbody id="lista"></tbody></table></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="COLOQUE_SUA_URL_AQUI",SUPABASE_ANON_KEY="COLOQUE_SUA_ANON_KEY_AQUI";const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
async function login(){const {error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});err.textContent=error?error.message:"";if(!error)mostrar()}
async function logout(){await db.auth.signOut();location.reload()}async function mostrar(){loginBox.style.display="none";app.style.display="block";carregar()}
async function carregar(){const {data,error}=await db.from("rsvps").select("nome,resposta,created_at").order("created_at",{ascending:false});if(error){lista.innerHTML='<tr><td colspan="3" class="empty">Erro ao carregar respostas.</td></tr>';return}vai.textContent=data.filter(x=>x.resposta==="Vai").length;nao.textContent=data.filter(x=>x.resposta==="Não vai").length;total.textContent=data.length;lista.innerHTML=data.length?data.map(x=>`<tr><td>${esc(x.nome)}</td><td>${x.resposta==="Vai"?"🟢 Vai":"🔴 Não vai"}</td><td>${new Date(x.created_at).toLocaleString("pt-BR")}</td></tr>`).join(""):'<tr><td colspan="3" class="empty">Nenhuma resposta ainda.</td></tr>'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}db.auth.getSession().then(({data})=>{if(data.session)mostrar()});
</script></body></html>
